<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GlyphX Chart</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #f0f2f5;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 16px;
      color: #1a202c;
    }

    .glyphx-wrapper {
      width: 100%;
      max-width: 1100px;
    }

    .glyphx-card {
      background: #ffffff;
      border-radius: 12px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.08), 0 1px 4px rgba(0,0,0,0.04);
      overflow: hidden;
    }

    .glyphx-toolbar {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 8px;
      padding: 10px 14px;
      background: #fafafa;
      border-bottom: 1px solid #e8eaed;
    }

    .glyphx-toolbar span {
      margin-right: auto;
      font-size: 11px;
      color: #888;
      letter-spacing: 0.04em;
    }

    .glyphx-btn {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 5px 11px;
      font-size: 12px;
      font-family: inherit;
      font-weight: 500;
      color: #444;
      background: #fff;
      border: 1px solid #d1d5db;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s, box-shadow 0.15s;
      user-select: none;
    }
    .glyphx-btn:hover  { background: #f5f5f5; border-color: #aaa; }
    .glyphx-btn:active { background: #ebebeb; }
    .glyphx-btn.share  { color: #2563eb; border-color: #bfdbfe; background: #eff6ff; }
    .glyphx-btn.share:hover { background: #dbeafe; }

    .glyphx-chart-area {
      padding: 20px;
    }

    svg {
      width: 100%;
      height: auto;
      display: block;
    }

    /* -- Interactivity -- */
    .glyphx-point {
      cursor: pointer;
    }
    .glyphx-point:hover {
      stroke: #1a202c;
      stroke-width: 2;
    }

    /* -- Tooltip -- */
    .glyphx-tooltip {
      position: fixed;
      background: rgba(15, 23, 42, 0.92);
      color: #f8fafc;
      padding: 7px 11px;
      border-radius: 7px;
      font-size: 12.5px;
      line-height: 1.6;
      pointer-events: none;
      display: none;
      z-index: 9999;
      box-shadow: 0 4px 14px rgba(0,0,0,0.25);
      max-width: 220px;
    }
    .glyphx-tooltip .tt-label { font-weight: 600; margin-bottom: 2px; }
    .glyphx-tooltip .tt-row   { opacity: 0.85; }

    /* -- Brush hint badge (injected by brush.js) -- */
    .glyphx-brush-hint {
      /* Styled by brush.js inline -- see brush.js */
    }

    /* -- Copied toast -- */
    .glyphx-toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(10px);
      background: rgba(15,23,42,0.9);
      color: #f8fafc;
      padding: 8px 18px;
      border-radius: 20px;
      font-size: 13px;
      opacity: 0;
      transition: opacity 0.25s, transform 0.25s;
      pointer-events: none;
      z-index: 99999;
    }
    .glyphx-toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }
  </style>
</head>

  <script>
  /* -- Tooltip -- */
  (function () {
    const tip = document.getElementById('glyphx-tooltip');
    document.addEventListener('DOMContentLoaded', () => {
      document.querySelectorAll('.glyphx-point').forEach(el => {
        el.addEventListener('mouseenter', () => {
          const x   = el.getAttribute('data-x');
          const y   = el.getAttribute('data-y');
          const lbl = el.getAttribute('data-label');
          const val = el.getAttribute('data-value');
          const q1  = el.getAttribute('data-q1');
          const q2  = el.getAttribute('data-q2');
          const q3  = el.getAttribute('data-q3');

          let html = '';
          if (lbl) html += `<div class="tt-label">${lbl}</div>`;
          if (q1)  html += `<div class="tt-row">Q1: ${(+q1).toFixed(3)}</div>
                            <div class="tt-row">Median: ${(+q2).toFixed(3)}</div>
                            <div class="tt-row">Q3: ${(+q3).toFixed(3)}</div>`;
          else {
            if (x !== null) html += `<div class="tt-row">x: ${x}</div>`;
            if (y !== null) html += `<div class="tt-row">y: ${y}</div>`;
            if (val)        html += `<div class="tt-row">value: ${val}</div>`;
          }
          tip.innerHTML = html || el.textContent;
          tip.style.display = 'block';
        });

        el.addEventListener('mousemove', e => {
          tip.style.left = (e.clientX + 14) + 'px';
          tip.style.top  = (e.clientY + 14) + 'px';
        });

        el.addEventListener('mouseleave', () => {
          tip.style.display = 'none';
        });
      });
    });
  })();

  /* -- Toast helper -- */
  function glyphxToast(msg) {
    const t = document.getElementById('glyphx-toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2200);
  }

  /* -- Download -- */
  function glyphxDownload(type) {
    const svg = document.querySelector('svg');
    const ser = new XMLSerializer();
    const svgStr = ser.serializeToString(svg);
    const blob = new Blob([svgStr], { type: 'image/svg+xml;charset=utf-8' });

    if (type === 'svg') {
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = 'glyphx_chart.svg';
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      glyphxToast('SVG downloaded');
      return;
    }

    const canvas = document.createElement('canvas');
    const bbox = svg.getBBox ? svg.getBBox() : { width: svg.clientWidth, height: svg.clientHeight };
    canvas.width  = bbox.width  + 40 || 800;
    canvas.height = bbox.height + 40 || 600;
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    const img = new Image();
    img.onload = () => {
      ctx.drawImage(img, 20, 20);
      const a = document.createElement('a');
      a.download = `glyphx_chart.${type}`;
      a.href = canvas.toDataURL(type === 'jpg' ? 'image/jpeg' : 'image/png');
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      glyphxToast(`${type.toUpperCase()} downloaded`);
    };
    img.src = URL.createObjectURL(blob);
  }

  /* -- Share (copy self-contained HTML to clipboard) -- */
  function glyphxCopyHtml() {
    const html = document.documentElement.outerHTML;
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(html).then(() => {
        glyphxToast('[OK] Full page HTML copied to clipboard!');
      });
    } else {
      const ta = document.createElement('textarea');
      ta.value = html;
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
      glyphxToast('[OK] Full page HTML copied to clipboard!');
    }
  }
  </script>

  <script>
/**
 * GlyphX Zoom + Pan
 *
 * Mouse wheel  -> zoom (centred on cursor)
 * Mouse drag   -> pan  (only when Shift is NOT held -- Shift+drag = brush)
 */
(function () {
  const svgs = document.querySelectorAll('svg[data-glyphx]');
  if (!svgs.length) return;

  svgs.forEach(svg => {
    let viewBox   = svg.getAttribute('viewBox').split(' ').map(Number);
    let isPanning = false;
    let startX    = 0, startY = 0;

    svg.style.cursor = 'grab';

    svg.addEventListener('mousedown', e => {
      // Leave Shift+drag to brush.js
      if (e.shiftKey || e.button !== 0) return;
      isPanning = true;
      startX    = e.clientX;
      startY    = e.clientY;
      svg.style.cursor = 'grabbing';
    });

    svg.addEventListener('mousemove', e => {
      if (!isPanning) return;
      const dx = (e.clientX - startX) * (viewBox[2] / svg.clientWidth);
      const dy = (e.clientY - startY) * (viewBox[3] / svg.clientHeight);
      viewBox[0] -= dx;
      viewBox[1] -= dy;
      svg.setAttribute('viewBox', viewBox.join(' '));
      startX = e.clientX;
      startY = e.clientY;
    });

    ['mouseup', 'mouseleave'].forEach(ev => {
      svg.addEventListener(ev, () => {
        if (isPanning) {
          isPanning = false;
          svg.style.cursor = 'grab';
        }
      });
    });

    svg.addEventListener('wheel', e => {
      e.preventDefault();
      const factor = e.deltaY > 0 ? 1.1 : 1 / 1.1;
      const [x, y, w, h] = viewBox;
      const nw = w * factor;
      const nh = h * factor;
      const mx = e.offsetX / svg.clientWidth;
      const my = e.offsetY / svg.clientHeight;
      viewBox = [x + mx * (w - nw), y + my * (h - nh), nw, nh];
      svg.setAttribute('viewBox', viewBox.join(' '));
    }, { passive: false });

    // Double-click on empty space resets the view. On a data point it means
    // "focus this series" instead (interact.js), so ignore those -- one
    // gesture doing both at once was the previous behaviour and read as a
    // glitch: the chart would isolate a series and jump back to full extent
    // in the same motion.
    svg.addEventListener('dblclick', (e) => {
      if (e.target.closest('[data-x], [data-label]')) return;
      if (svg.dataset.originalViewBox) {
        svg.setAttribute('viewBox', svg.dataset.originalViewBox);
        viewBox = svg.dataset.originalViewBox.split(' ').map(Number);
      }
    });

    // Store original viewBox for reset
    svg.dataset.originalViewBox = viewBox.join(' ');
  });
})();
</script><script>
/**
 * GlyphX Linked Brushing
 *
 * Hold Shift + drag on any chart to draw a selection rectangle.
 * All .glyphx-point elements sharing the same data-x values
 * across EVERY chart on the page are highlighted; others dim.
 *
 * Keyboard shortcuts:
 *   Shift + drag  -- draw selection
 *   Escape        -- clear selection
 *   Click outside -- clear selection

      y: (e.clientY - rect.top)  * sy,

        el.style.filter  = '';

    r.setAttribute('y',      Math.min(y1, y2));

    svg.addEventListener('mousemove', e => {
      if (!isBrushing || activeSvg !== svg) return;

  document.addEventListener('keydown', e => {
    if (e.key === 'Shift') {

        ensureHint(svg).style.opacity = '1';
      });
    }
    if (e.key === 'Escape') { clearSelection(); }
  });

  document.addEventListener('keyup', e => {
    if (e.key === 'Shift') {
      document.querySelectorAll('.glyphx-brush-hint').forEach(h => {

      });
    }

    if (!e.shiftKey && !e.target.closest('svg[data-glyphx]')) {

    }

  function init() {
    document.querySelectorAll('svg[data-glyphx]').forEach(wireChart);
  }

    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }

/**
 * GlyphX Keyboard Accessibility
 *
 * Makes every .glyphx-point element fully keyboard-navigable:
 *
 *   Tab / Shift-Tab  -- move focus through data points
 *   Enter / Space    -- trigger the hover tooltip on the focused point
 *   Arrow keys       -- move to the next/previous point within a series
 *   Escape           -- dismiss tooltip and blur the active point
 *
 * Screen readers receive the aria-label built from data-x / data-y
 * attributes, so each point announces itself correctly.
 */
(function () {
  'use strict';

  const POINT_SEL = '.glyphx-point';

  // -- Build aria-label for a data point element ---------------------------
  function buildAriaLabel(el) {
    const x   = el.getAttribute('data-x');
    const y   = el.getAttribute('data-y');
    const lbl = el.getAttribute('data-label');
    const val = el.getAttribute('data-value');
    const q1  = el.getAttribute('data-q1');
    const q2  = el.getAttribute('data-q2');
    const q3  = el.getAttribute('data-q3');

    const parts = [];
    if (lbl) parts.push(lbl);
    if (q1)  parts.push(`Q1 ${(+q1).toFixed(2)}, median ${(+q2).toFixed(2)}, Q3 ${(+q3).toFixed(2)}`);
    else {
      if (x !== null) parts.push(`x: ${x}`);
      if (y !== null) parts.push(`y: ${y}`);
      if (val)        parts.push(`value: ${val}`);
    }
    return parts.join(', ') || 'Data point';
  }

  // -- Show / hide the shared GlyphX tooltip -------------------------------
  function showTip(el) {
    const tip = document.getElementById('glyphx-tooltip');
    if (!tip) return;
    const lbl = el.getAttribute('data-label');
    const x   = el.getAttribute('data-x');
    const y   = el.getAttribute('data-y');
    const val = el.getAttribute('data-value');
    const q1  = el.getAttribute('data-q1');
    const q2  = el.getAttribute('data-q2');
    const q3  = el.getAttribute('data-q3');

    let html = '';
    if (lbl) html += `<div class="tt-label">${lbl}</div>`;
    if (q1)  html += `<div class="tt-row">Q1: ${(+q1).toFixed(3)}</div>
                      <div class="tt-row">Median: ${(+q2).toFixed(3)}</div>
                      <div class="tt-row">Q3: ${(+q3).toFixed(3)}</div>`;
    else {
      if (x !== null) html += `<div class="tt-row">x: ${x}</div>`;
      if (y !== null) html += `<div class="tt-row">y: ${y}</div>`;
      if (val)        html += `<div class="tt-row">value: ${val}</div>`;
    }

    tip.innerHTML = html || buildAriaLabel(el);
    tip.style.display = 'block';

    // Position near the focused element
    try {
      const rect = el.getBoundingClientRect();
      tip.style.left = (rect.right + 8) + 'px';
      tip.style.top  = (rect.top  - 4) + 'px';
    } catch (_) {}
  }

  function hideTip() {
    const tip = document.getElementById('glyphx-tooltip');
    if (tip) tip.style.display = 'none';
  }

  // -- Wire a single point element -----------------------------------------
  function wirePoint(el, allPoints) {
    // Stamp aria-label so screen readers announce values
    if (!el.getAttribute('aria-label')) {
      el.setAttribute('aria-label', buildAriaLabel(el));
    }

    el.addEventListener('focus', () => showTip(el));
    el.addEventListener('blur',  hideTip);

    el.addEventListener('keydown', e => {
      const idx = allPoints.indexOf(el);

      switch (e.key) {
        case 'Enter':
        case ' ':
          showTip(el);
          e.preventDefault();
          break;

        case 'ArrowRight':
        case 'ArrowDown': {
          e.preventDefault();
          const next = allPoints[idx + 1];
          if (next) next.focus();
          break;
        }

        case 'ArrowLeft':
        case 'ArrowUp': {
          e.preventDefault();
          const prev = allPoints[idx - 1];
          if (prev) prev.focus();
          break;
        }

        case 'Escape':
          hideTip();
          el.blur();
          break;
      }
    });
  }

  // -- Init ------------------------------------------------------------------
  function init() {
    const allPoints = Array.from(document.querySelectorAll(POINT_SEL));
    allPoints.forEach(el => wirePoint(el, allPoints));
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
})();

/*
 * GlyphX -- interactive legend.
 *
 * Clicking (or pressing Enter/Space on) a legend entry hides or shows the
 * matching series. draw_legend() already stamps every icon and label with
 * data-target="series-N", which is the same class each series puts on its
 * own SVG elements, so the wiring is a class lookup.
 *
 * Hiding uses the "hidden" attribute plus a CSS class rather than an inline
 * style, so the toggle survives a re-render and does not fight any stylesheet
 * the host page applies.
 */
(function () {
  "use strict";

  var HIDDEN_CLASS = "glyphx-series-hidden";

  function seriesElements(root, target) {
    // Series elements carry the target class; legend entries carry
    // data-target and must not hide themselves.
    return Array.prototype.filter.call(
      root.querySelectorAll("." + target),
      function (el) {
        return !el.hasAttribute("data-target");
      }
    );
  }

  function legendEntries(root, target) {
    return root.querySelectorAll('[data-target="' + target + '"]');
  }

  function setHidden(root, target, hidden) {
    seriesElements(root, target).forEach(function (el) {
      if (hidden) {
        el.classList.add(HIDDEN_CLASS);
        el.setAttribute("visibility", "hidden");
      } else {
        el.classList.remove(HIDDEN_CLASS);
        el.removeAttribute("visibility");
      }
    });

    legendEntries(root, target).forEach(function (el) {
      // Dim the legend entry so the toggle state is visible, and expose it
      // to assistive tech.
      el.setAttribute("opacity", hidden ? "0.35" : "1");
      el.setAttribute("aria-pressed", hidden ? "false" : "true");
    });
  }

  function isHidden(root, target) {
    var els = seriesElements(root, target);
    return els.length > 0 && els[0].classList.contains(HIDDEN_CLASS);
  }

  function bind(root) {
    var entries = root.querySelectorAll(".legend-icon, .legend-label");
    if (!entries.length) return;

    entries.forEach(function (el) {
      var target = el.getAttribute("data-target");
      if (!target) return;

      // Make the entry operable without a mouse.
      el.setAttribute("role", "switch");
      el.setAttribute("tabindex", "0");
      el.setAttribute("aria-pressed", "true");
      el.style.cursor = "pointer";

      var label = el.textContent || target;
      el.setAttribute("aria-label", "Toggle series " + label);

      function toggle(event) {
        event.preventDefault();
        setHidden(root, target, !isHidden(root, target));
      }

      el.addEventListener("click", toggle);
      el.addEventListener("keydown", function (event) {
        if (event.key === "Enter" || event.key === " " || event.key === "Spacebar") {
          toggle(event);
        }
      });
    });
  }

  function init() {
    var charts = document.querySelectorAll('svg[data-glyphx="true"]');
    if (charts.length) {
      Array.prototype.forEach.call(charts, bind);
    } else {
      bind(document);
    }

    document.addEventListener("DOMContentLoaded", init);
  } else {
    init();
  }

 * GlyphX -- cross-chart filtering.
 *
 * Click a bar, point or slice in one chart and every other GlyphX chart on
 * the page dims everything that does not share that x value. Click the same
 * element again, or press Escape, to clear.
 *
 * The wiring is already in the markup: every drawn element carries data-x,
 * so the x value is the join key between charts. Nothing is sent anywhere
 * and no server is involved -- the charts on the page are the whole dataset.
 *
 * Deliberately scoped to data-x. Filtering on data-y would mean matching on
 * a measured value rather than a category, which is almost never what
 * someone means by "show me February".
 */
(function () {
  "use strict";

  var DIM_CLASS = "glyphx-crossfilter-dim";
  var DIM_OPACITY = "0.12";
  var active = null;               // currently selected data-x, or null

  // Charts opt in by carrying data-glyphx-crossfilter on their root <svg>.
  // Anything without it is left alone, so a page can mix filtered and
  // independent charts.
  function participatingRoots() {
    return Array.prototype.slice.call(
      document.querySelectorAll("svg[data-glyphx-crossfilter]")
    );
  }

  function ensureStyle() {
    if (document.getElementById("glyphx-crossfilter-style")) return;
    var style = document.createElement("style");
    style.id = "glyphx-crossfilter-style";
    // A class rather than an inline style, so a re-render or a host
    // stylesheet does not fight the toggle.
    style.textContent =
      "." + DIM_CLASS + " { opacity: " + DIM_OPACITY + "; " +
      "transition: opacity 120ms ease-out; }";
    document.head.appendChild(style);
  }

  function apply(value) {
    participatingRoots().forEach(function (root) {
      var elements = root.querySelectorAll("[data-x]");
      Array.prototype.forEach.call(elements, function (el) {
        if (value === null || el.getAttribute("data-x") === value) {
          el.classList.remove(DIM_CLASS);
        } else {
          el.classList.add(DIM_CLASS);
        }
      });
    });
    announce(value);
  }

  // Screen readers get told what happened; the visual change alone is not
  // an accessible signal.
  function announce(value) {
    var live = document.getElementById("glyphx-crossfilter-status");
    if (!live) {
      live = document.createElement("div");
      live.id = "glyphx-crossfilter-status";
      live.setAttribute("aria-live", "polite");
      live.setAttribute("role", "status");
      live.style.cssText =
        "position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);";
      document.body.appendChild(live);
    }
    live.textContent = value === null
      ? "Filter cleared. All data shown."
      : "Filtered to " + value + " across all charts.";
  }

  function select(value) {
    active = (active === value) ? null : value;   // clicking again clears
    apply(active);
  }

  // Capture phase, and stop propagation once handled. interact.js binds a
  // click handler on document too, and its series-highlight sets *inline*
  // opacity, which beats a class rule -- so with both live the two fought:
  // the clicked chart stayed fully lit and the other went uniformly grey.
  // On a crossfilter chart a plain click means "filter", so interact.js
  // should not also see it. Modified clicks fall through untouched, which
  // keeps shift+click opening the inspector.
  document.addEventListener("click", function (e) {
    var el = e.target.closest ? e.target.closest("[data-x]") : null;
    if (!el) return;
    var root = el.closest("svg[data-glyphx-crossfilter]");
    if (!root) return;
    if (e.shiftKey || e.altKey || e.metaKey || e.ctrlKey) return;
    e.stopPropagation();
    select(el.getAttribute("data-x"));
  }, true);

  // Keyboard parity: elements are already focusable with tabindex="0".
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape" && active !== null) {
      active = null;
      apply(null);
      return;
    }
    if (e.key !== "Enter" && e.key !== " ") return;
    var el = document.activeElement;
    if (!el || !el.getAttribute || !el.getAttribute("data-x")) return;
    if (!el.closest("svg[data-glyphx-crossfilter]")) return;
    e.preventDefault();
    select(el.getAttribute("data-x"));
  });

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", ensureStyle);
  } else {
    ensureStyle();
  }
})();
</script><script>
/*
 * GlyphX -- selection events.
 *
 * Clicking a data point dispatches a `glyphx:select` CustomEvent on
 * `document`, and clicking empty space dispatches `glyphx:deselect`. That is
 * the whole extension surface: anything on the page -- a detail panel, a
 * table, a second chart, an <img>, a fetch to your own endpoint -- can listen
 * and update itself.
 *
 *   document.addEventListener('glyphx:select', (e) => {
 *     const { x, y, label, series, meta, element } = e.detail;
 *     document.getElementById('detail').textContent = meta.customer;
 *   });
 *
 * `meta` is whatever was passed to the series as `meta=[...]` in Python,
 * parsed back from JSON, so the listener receives the same structure the
 * caller wrote rather than a flattened string.
 *
 * Events rather than a callback registry: any number of listeners can attach
 * without knowing about each other, they can be removed, and nothing here
 * needs to know what they do. No server, no callback round-trip -- this all
 * runs in the exported file.
 */
(function () {
  "use strict";

  var SELECTED_CLASS = "glyphx-selected";
  var selected = null;

  function ensureStyle() {
    if (document.getElementById("glyphx-select-style")) return;
    var style = document.createElement("style");
    style.id = "glyphx-select-style";
    // An outline rather than a fill change, so the point keeps its encoded
    // colour -- the colour is data, the selection is not.
    style.textContent =
      "." + SELECTED_CLASS + " { stroke: currentColor; stroke-width: 2.5px; " +
      "paint-order: stroke; }";
    document.head.appendChild(style);
  }

  function parseMeta(el) {
    var raw = el.getAttribute("data-meta");
    if (!raw) return null;
    try {
      return JSON.parse(raw);
    } catch (err) {
      // Malformed metadata should not take the whole page down; hand the
      // listener the raw string and let it decide.
      return raw;
    }
  }

  function seriesOf(el) {
    var cls = Array.prototype.find.call(el.classList, function (c) {
      return c.indexOf("series-") === 0 || c.indexOf("series3d-") === 0;
    });
    return cls || null;
  }

  function detailFor(el) {
    return {
      x: el.getAttribute("data-x"),
      y: el.getAttribute("data-y"),
      label: el.getAttribute("data-label"),
      series: seriesOf(el),
      meta: parseMeta(el),
      element: el,
    };
  }

  function clearSelection() {
    if (!selected) return;
    selected.classList.remove(SELECTED_CLASS);
    selected = null;
    document.dispatchEvent(new CustomEvent("glyphx:deselect"));
  }

  function select(el) {
    if (selected === el) {          // clicking the same point again clears
      clearSelection();
      return;
    }
    if (selected) selected.classList.remove(SELECTED_CLASS);
    selected = el;
    el.classList.add(SELECTED_CLASS);
    document.dispatchEvent(new CustomEvent("glyphx:select", {
      detail: detailFor(el),
    }));
  }

  // Capture phase, because crossfilter.js also claims plain clicks and calls
  // stopPropagation() there -- a bubble-phase listener would never run on a
  // chart with filtering enabled. Both are capture listeners on `document`,
  // and stopPropagation does not stop siblings on the same node, so the two
  // features compose: one click both filters and emits a selection.
  document.addEventListener("click", function (e) {
    if (!e.target.closest) return;
    var el = e.target.closest("[data-x]");
    if (!el || !el.closest("svg[data-glyphx]")) {
      // A click on the chart background means "nothing is selected".
      if (e.target.closest && e.target.closest("svg[data-glyphx]")) {
        clearSelection();
      }
      return;
    }
    // Modified clicks belong to the inspector and the other interact.js
    // gestures; only a plain click is a selection.
    if (e.shiftKey || e.altKey || e.metaKey || e.ctrlKey) return;
    select(el);
  }, true);

  // Keyboard parity: points already carry tabindex="0".
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape") {
      clearSelection();
      return;
    }
    if (e.key !== "Enter" && e.key !== " ") return;
    var el = document.activeElement;
    if (!el || !el.getAttribute || el.getAttribute("data-x") === null) return;
    if (!el.closest("svg[data-glyphx]")) return;
    e.preventDefault();
    select(el);
  });

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", ensureStyle);
  } else {
    ensureStyle();
  }
})();
</script><script>
/*
 * GlyphX -- selection detail panel.
 *
 * A panel that fills itself in when a point is clicked, so the common case
 * ("click a point, show its details") needs no JavaScript from the caller.
 * Configured entirely from Python:
 *
 *     fig.add_detail_panel(fields=["customer", "region"])
 *
 * which emits a <div data-glyphx-detail-panel='{...}'> next to the chart.
 * This reads that config and subscribes to the `glyphx:select` event that
 * select.js already dispatches -- it is an ordinary consumer of the public
 * event, not a special case wired into the chart. Anything else on the page
 * can listen to the same event at the same time.
 */
(function () {
  "use strict";

  var STYLE_ID = "glyphx-detail-panel-style";

  function ensureStyle() {
    if (document.getElementById(STYLE_ID)) return;
    var style = document.createElement("style");
    style.id = STYLE_ID;
    style.textContent = [
      ".glyphx-detail-panel {",
      "  font: 13px/1.5 -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;",
      "  border: 1px solid rgba(0,0,0,.12); border-radius: 8px;",
      "  padding: 12px 14px; min-width: 180px; background: #fff;",
      "}",
      ".glyphx-detail-panel[data-empty='true'] { color: #6b7280; }",
      ".glyphx-detail-panel dl { margin: 0; display: grid;",
      "  grid-template-columns: auto 1fr; gap: 4px 12px; }",
      ".glyphx-detail-panel dt { color: #6b7280; white-space: nowrap; }",
      ".glyphx-detail-panel dd { margin: 0; font-variant-numeric: tabular-nums; }",
      ".glyphx-detail-panel h4 { margin: 0 0 8px; font-size: 13px; }",
      // Put the panel beside the chart when there is room, and below it on
      // a narrow screen, without the caller writing any layout CSS. The
      // template sets `svg { width: 100% }`, which would take the whole row
      // and push the panel onto the next line, so the SVG is given a flex
      // basis it can shrink from instead.
      ".glyphx-chart-area:has(.glyphx-detail-panel) {",
      "  display: flex; gap: 16px; align-items: flex-start; flex-wrap: wrap;",
      "}",
      ".glyphx-chart-area:has(.glyphx-detail-panel) > svg {",
      "  flex: 1 1 340px; min-width: 0; width: auto;",
      "}",
      ".glyphx-chart-area > .glyphx-detail-panel { flex: 0 1 220px; }",
    ].join("\n");
    document.head.appendChild(style);
  }

  function config(panel) {
    try {
      return JSON.parse(panel.getAttribute("data-glyphx-detail-panel")) || {};
    } catch (err) {
      return {};
    }
  }

  // Text, never markup: the values come from the chart's own data, which is
  // whatever the caller plotted. Building innerHTML from it would make any
  // dataset containing a "<" an injection vector.
  function row(dl, term, value) {
    var dt = document.createElement("dt");
    dt.textContent = term;
    var dd = document.createElement("dd");
    dd.textContent = value;
    dl.appendChild(dt);
    dl.appendChild(dd);
  }

  function render(panel, detail) {
    var cfg = config(panel);
    panel.textContent = "";
    panel.setAttribute("data-empty", "false");

    if (cfg.title) {
      var heading = document.createElement("h4");
      heading.textContent = cfg.title;
      panel.appendChild(heading);
    }

    var dl = document.createElement("dl");
    var meta = (detail.meta && typeof detail.meta === "object") ? detail.meta : {};

    if (cfg.fields && cfg.fields.length) {
      // An explicit field list also fixes the order, which Object.keys()
      // would not guarantee across browsers for numeric-looking keys.
      cfg.fields.forEach(function (field) {
        var value = meta[field];
        if (value === undefined && field === "x") value = detail.x;
        if (value === undefined && field === "y") value = detail.y;
        if (value === undefined && field === "label") value = detail.label;
        if (value === undefined) return;      // absent for this point
        row(dl, field, value);
      });
    } else {
      // No field list: show whatever the point carries, metadata first.
      Object.keys(meta).forEach(function (k) { row(dl, k, meta[k]); });
      if (!Object.keys(meta).length) {
        row(dl, "x", detail.x);
        row(dl, "y", detail.y);
        if (detail.label) row(dl, "series", detail.label);
      }
    }

    panel.appendChild(dl);
  }

  function clear(panel) {
    var cfg = config(panel);
    panel.textContent = cfg.empty || "Click a point to see its details.";
    panel.setAttribute("data-empty", "true");
  }

  function panels() {
    return Array.prototype.slice.call(
      document.querySelectorAll("[data-glyphx-detail-panel]")
    );
  }

  function init() {
    var found = panels();
    if (!found.length) return;
    ensureStyle();
    found.forEach(clear);

    document.addEventListener("glyphx:select", function (e) {
      panels().forEach(function (panel) { render(panel, e.detail); });
    });
    document.addEventListener("glyphx:deselect", function () {
      panels().forEach(clear);
    });
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", init);
  } else {
    init();
  }
})();
</script>
</body>
</html>
