[tox]
envlist =
    py{310,311,312,313}
    py312-oldestdeps
    py312-cov
    lint
    docs
isolated_build = true

[testenv]
usedevelop = True
description = Run tests
extras = test
commands = pytest tests -m "not browser" {posargs}

[testenv:py312-oldestdeps]
description = Test against the minimum supported dependency versions
extras = test
deps =
    numpy==1.26.*
    pandas==2.1.*
commands = pytest tests -m "not browser" {posargs}

[testenv:py312-cov]
description = Test with coverage
extras = test
commands =
    pytest tests --cov=glyphx --cov-report=term-missing --cov-report=xml \
        --cov-fail-under=78 {posargs}

[testenv:lint]
description = Static analysis
skip_install = true
deps =
    ruff>=0.6
commands =
    ruff check glyphx tests
# NOTE: `ruff format --check` is deliberately not wired in yet -- it would
# reformat 50 of 55 files in one commit, burying real changes in churn.
# Run `ruff format glyphx` as a standalone commit when you want to adopt it.

[testenv:browser]
description = Render every chart type in Chromium
extras = test, browser
commands =
    playwright install --with-deps chromium
    pytest tests -m browser {posargs}

[testenv:docs]
description = Build the HTML docs; warnings are errors
extras = docs
commands = sphinx-build -b html -W --keep-going docs {envtmpdir}/html

[testenv:typing]
description = Type checking (advisory until the error count is driven down)
extras = test
deps = mypy>=1.10
# The leading "-" makes tox report the errors without failing the env, which
# is what "advisory" was always meant to mean.  Drop it once the count is 0.
commands = - mypy glyphx --ignore-missing-imports
