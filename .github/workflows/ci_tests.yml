name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

concurrency:
  # A new push to the same branch cancels in-flight runs for the old commit.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install tox
        run: python -m pip install --upgrade pip tox
      - name: Ruff
        run: tox -e lint

  typing:
    name: typing (advisory)
    runs-on: ubuntu-latest
    continue-on-error: true   # informational until the error count is driven down
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip tox
      - run: tox -e typing

  browser:
    name: browser rendering
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip tox
      - name: Render every chart type in Chromium
        run: tox -e browser

  ci-tests:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    if: "!(contains(github.event.head_commit.message, '[skip ci]') || contains(github.event.head_commit.message, '[ci skip]'))"
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: ubuntu-py310, os: ubuntu-latest, python: "3.10", tox_env: py310 }
          - { name: ubuntu-py311, os: ubuntu-latest, python: "3.11", tox_env: py311 }
          - { name: ubuntu-py312, os: ubuntu-latest, python: "3.12", tox_env: py312 }
          - { name: ubuntu-py313, os: ubuntu-latest, python: "3.13", tox_env: py313 }
          - { name: ubuntu-py312-cov, os: ubuntu-latest, python: "3.12", tox_env: py312-cov }
          - { name: ubuntu-py312-oldestdeps, os: ubuntu-latest, python: "3.12", tox_env: py312-oldestdeps }
          - { name: macos-py312, os: macos-latest, python: "3.12", tox_env: py312 }
          - { name: windows-py312, os: windows-latest, python: "3.12", tox_env: py312 }

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0        # setuptools_scm needs the tag history

      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install tox
        run: |
          python -m pip install --upgrade pip
          python -m pip install tox

      - name: Run tests
        run: tox -e ${{ matrix.tox_env }} -- ${{ matrix.toxposargs }}

      - name: Upload coverage to Codecov
        if: matrix.tox_env == 'py312-cov'
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
